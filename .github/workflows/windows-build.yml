name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore IndustrialDataAnalyzer.slnx

      - name: Build Debug
        run: dotnet build IndustrialDataAnalyzer.slnx --configuration Debug --no-restore

      - name: Run xUnit tests
        run: dotnet test IndustrialDataAnalyzer.slnx --configuration Debug --no-build --no-restore
